<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HashNote</title>
    <style>
        /* Define Color Variables (Dark Mode Default) */
        :root {
            --bg-primary: #1a1a1a;      
            --text-primary: #f0f0f0;     
            --shadow-color: rgba(0, 0, 0, 0.5);
        }
        
        /* Light Mode Definition */
         body.light-mode {
            --bg-primary: #f5f5f5;
            --text-primary: #1a1a1a;
            --shadow-color: rgba(0, 0, 0, 0.15);
            
            #editor::-webkit-scrollbar-thumb {
                background-color: rgba(0, 0, 0, 0.3);
            }
            
            #editor::-webkit-scrollbar-thumb:hover {
                background-color: rgba(0, 0, 0, 0.5);
            }
        }

        /* Global Styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-y: auto;         
            font-family: monospace;
            display: flex; 
            justify-content: center;
            align-items: flex-start; 
            
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease;
        }

        /* Editor Styles */
        #editor {
            width: 65vw;    
            min-height: 90vh; 
            margin: 50px 0;
            
            box-sizing: border-box; 
            border: none;
            resize: none; 
            padding: 30px; 
            font-size: 16px;
            line-height: 1.5;
            outline: none; 

            background-color: var(--bg-primary); 
            color: var(--text-primary);
            /* box-shadow: 0 8px 25px var(--shadow-color); */
            transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;

            border-radius: 12px; 
        }   

        /* Custom Scrollbar Styles */

        /* Scrollbar Track (Hintergrund-Spur) */
        #editor::-webkit-scrollbar {
            width: 10px; /* Breite der Scrollbar */
        }

        /* Scrollbar Thumb */
        #editor::-webkit-scrollbar-thumb {
            border-radius: 5px; 
            background-color: rgba(255, 255, 255, 0.25); 
        }

        /* Hover Effect  */
        #editor::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
            
        /* #region Uiverse Switch Styles (Day/Night - JustCode14)  */

        /* Container placement (Adjusted to position the switch) */
        .toggle-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The switch - the box around the slider */
        .switch {
            font-size: 17px;
            position: relative;
            display: inline-block;
            width: 4em;
            height: 2.2em;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The slider (The track) */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a2a; 
            transition: 0.4s;
            border-radius: 30px;
            overflow: hidden;
        }

        /* The thumb (Moon/Sun) */
        .slider:before {
            position: absolute;
            content: "";
            height: 1.2em;
            width: 1.2em;
            border-radius: 20px;
            left: 0.5em;
            bottom: 0.5em;
            transition: 0.4s;
            transition-timing-function: cubic-bezier(0.81, -0.04, 0.38, 1.5);
            box-shadow: inset 8px -4px 0px 0px #fff; 
        }

        /* Checked State (Light Mode) */
        .switch input:checked + .slider {
            /* Day Background */
            background-color: #00a6ff;
        }

        .switch input:checked + .slider:before {
            transform: translateX(1.8em);
            /* Sun Shadow */
            box-shadow: inset 15px -4px 0px 15px #ffcf48;
        }

        /* Stars (Visible in Dark Mode) */
        .star {
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            width: 5px;
            transition: all 0.4s;
            height: 5px;
            opacity: 1;
        }

        .star_1 { left: 2.5em; top: 0.5em; }
        .star_2 { left: 2.2em; top: 1.2em; }
        .star_3 { left: 3em; top: 0.9em; }

        .switch input:checked ~ .slider .star {
            opacity: 0; /* Hide stars in Light Mode */
        }

        /* Clouds (Visible in Light Mode) */
        .cloud {
            width: 3.5em;
            position: absolute;
            bottom: -1.4em;
            left: -1.1em;
            opacity: 0;
            transition: all 0.4s;
        }

        .switch input:checked ~ .slider .cloud {
            opacity: 1; /* Show clouds in Light Mode */
        }

        /* #endregion */
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>

<body>
    <div class="toggle-container">
        <label class="switch">
            <input type="checkbox" id="mode-toggle" />
            <span class="slider">
                <div class="star star_1"></div>
                <div class="star star_2"></div>
                <div class="star star_3"></div>
                <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                    <path
                        transform="matrix(.77976 0 0 .78395-299.99-418.63)"
                        fill="#fff"
                        d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
                    ></path>
                </svg>
            </span>
        </label>
    </div>
    <textarea id="editor"></textarea>
    <script src="editor.js"></script>
</body>

</html>
